):"],["  name | id | rank | need | average_z_score | disagreement | concensus_weight | final_score"],["One row per concept, sorted by rank ascending."],[""],["After the last concept row, leave ONE blank row, then add a row with these three values:"],["  HIGHEST_SCORING_CONCEPT_NAME | HIGHEST_SCORING_CONCEPT_ID | HIGHEST_SCORING_CONCEPT_DESCRIPTION"],["(The description should be 2–3 sentences explaining why this concept scored highest.)"],[""],["After that row, leave ONE blank row, then add three rows — one per insight:"],["  INSIGHT_1"],["  INSIGHT_2"],["  INSIGHT_3"],["Each insight is one brief observation about scoring patterns (e.g., strong consensus, high disagreement)."],[""],["═══════════════════════════════════════════════════════════════"],["RETURN FORMAT"],["═══════════════════════════════════════════════════════════════"],[""],["Return a single Excel workbook (.xlsx) with exactly TWO sheets:"],['  Sheet 1 named "Features and Themes"  — Step 1 output'],['  Sheet 2 named "Concept Scores"       — Step 2 output'],["Do not include additional sheets. Do not repeat these instructions in your output."]],uc="I have attached a workbook for a Diverge & Converge workshop analysis. Sheet 1 contains the complete analysis instructions and any required context. The remaining sheets contain the input data. Please follow the instructions on Sheet 1 exactly and return a single .xlsx file in the format specified at the end of Sheet 1. Do not include the instructions in your output.";function fc(e){return e.replace(/[\\/*[\]:?&]/g,"").slice(0,31)}var dc="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";function hc(e,t,r){var n=new Blob([e],{type:r}),a=URL.createObjectURL(n),s=document.createElement("a");s.href=a,s.download=t,document.body.appendChild(s),s.click(),document.body.removeChild(s),URL.revokeObjectURL(a)}function pc(e){return e.indexOf(",")>=0||e.indexOf('"')>=0||e.indexOf("\n")>=0?'"'+e.replace(/"/g,'""')+'"':e}var mc=function(e,t,r,n){return new(r
